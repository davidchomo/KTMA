<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1l7 7-7 7-7-7z' fill='%232962ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="static/app.css?v=31">
<link rel="stylesheet" href="static/lab.css?v=31">
</head>
<body class="tb-top">
<div id="app">
  <nav id="toolbar" class="no-chart">
    <div class="tb-sec" id="tbLeft">
    <button class="tbtn sq" id="bAll" title="Všetky funkcie podľa kategórií (a výber, čo je v paneli)"><span class="ic">⊞</span></button>
    <button class="tbtn" id="bSymbol" title="Symbol"><span class="ic">◆</span><span class="tx" id="symLabel">XAU/USD</span><span class="car">▾</span></button>
    <button class="tbtn" id="bType" title="Typ grafu"><span class="ic" id="typeIcon">🕯</span><span class="tx" id="typeLabel">Sviečky</span><span class="car">▾</span></button>
    <button class="tbtn" id="bTf" title="Časový rámec"><span class="ic">⏱</span><span class="tx" id="tfLabel">5m</span><span class="car">▾</span></button>
    <button class="tbtn" id="bTools" title="Tools – kreslenie, text a indikátory v jednom menu (Alt+T)"><span class="ic">🧰</span><span class="tx">Tools</span><span class="car">▾</span></button>
    <button class="tbtn" id="bHideInd" title="Skryť / zobraziť všetky indikátory vo všetkých grafoch (Alt+H)"><span class="ic">👁</span><span class="tx">Skryť ind.</span></button>
    <button class="tbtn" id="bCandles" title="Sviečky: typ grafu, tvar, farby"><span class="ic">🕯</span><span class="tx">Sviečky</span><span class="car">▾</span></button>
    <button class="tbtn" id="bAll2" title="Všetky funkcie na jednom mieste"><span class="ic">⊞</span><span class="tx">Všetko</span></button>
    <button class="tbtn" id="bSig" title="Buy / Sell skener: nákup alebo predaj na každom trhu a timeframe"><span class="ic">🎯</span><span class="tx">Buy/Sell</span></button>
    <button class="tbtn" id="bAddons" title="Toolbar Add-ons: sledovať cenu a ďalšie doplnky"><span class="ic">🧩</span><span class="tx">Toolbar Add-ons</span><span class="car">▾</span></button>
    <button class="tbtn" id="bFeat" title="Prehľad funkcií: čo je zapnuté a ako to zaťažuje graf"><span class="ic">🎛</span><span class="tx">Prehľad</span></button>
    <button class="tbtn" id="bDraw" title="Kreslenie"><span class="ic">✎</span><span class="tx">Kreslenie</span><span class="car">▾</span></button>
    <button class="tbtn" id="bText" title="Text, poznámky, pin, tabuľka, obrázok, príspevok, nápad"><span class="ic">T</span><span class="tx">Text</span><span class="car">▾</span></button>
    <button class="tbtn" id="bInd" title="Indikátory a vzory"><span class="ic">ƒx</span><span class="tx">Indikátory</span><span class="car">▾</span></button>
    </div><span class="tb-div"></span>
    <div class="tb-sec" id="tbMid">
    <button class="tbtn" id="bScan" title="Skenovať trh – možné vstupy"><span class="ic">🔍</span><span class="tx">Skenovať</span><span class="car"></span></button>
    <button class="tbtn" id="bIdea" title="Obchodný nápad a labelovanie"><span class="ic">💡</span><span class="tx">Nápad</span><span class="car"></span></button>
    <button class="tbtn" id="bReplay" title="Replay – zastaviť trh, skryť budúcnosť (Alt+R)"><span class="ic">⏯</span><span class="tx">Replay</span><span class="car">▾</span></button>
    <button class="tbtn" id="bFunc" title="Funkcie: čiary, objem, stratégie živých nápadov, pozadie podľa Technicals"><span class="ic">🧩</span><span class="tx">Funkcie</span><span class="car">▾</span></button>
    <button class="tbtn gone" id="bAuto" title="Auto trendové čiary a živé nápady (Alt+A)"><span class="ic">📐</span><span class="tx">Auto čiary</span><span class="car">▾</span></button>
    <button class="tbtn gone" id="bFlow" title="Objem a tok príkazov – bubliny kupujúcich a predávajúcich, delta, páska obchodov"><span class="ic">🫧</span><span class="tx">Objem</span><span class="car">▾</span></button>
    <button class="tbtn" id="bAlgo" title="Algoritmické obchodovanie: overené stratégie, test na dátach, živé signály a ich vysielanie"><span class="ic">🧠</span><span class="tx">Algo</span><span class="car"></span></button>
    <button class="tbtn gone" id="bTech" title="Technicals – súhrn indikátorov, pivoty a nápady pre každý timeframe"><span class="ic">📊</span><span class="tx">Technicals</span><span class="car"></span></button>
    <button class="tbtn" id="bLib" title="Knižnica – sviečkové formácie, grafické formácie, stratégie, tipy"><span class="ic">📚</span><span class="tx">Knižnica</span><span class="car"></span></button>
    </div><span class="tb-div"></span>
    <div class="tb-sec" id="tbRight">
    <button class="tbtn sq" id="bUndo" title="Späť o krok (Ctrl+Z)" disabled><span class="ic">↶</span></button>
    <button class="tbtn sq" id="bRedo" title="Znova – krok dopredu (Ctrl+Y / Ctrl+Shift+Z)" disabled><span class="ic">↷</span></button>
    <button class="tbtn sq" id="bLayout" title="Rozloženie: 1 až 4 grafy na jednej obrazovke"><span class="ic">▦</span></button>
    <button class="tbtn" id="bChat" title="Sociálne: chat (tím, nápady, signály, Claude), správy a kalendár, nástenka"><span class="ic">👥</span><span class="tx">Sociálne</span><span class="car"><i id="chatBadge" class="badge"></i></span></button>
    <button class="tbtn" id="bSettings" title="Nastavenia grafu a panelu"><span class="ic">⚙</span><span class="tx">Nastavenia</span><span class="car"></span></button>
    <button class="tbtn sq" id="bFull" title="Celá obrazovka (F11)"><span class="ic" id="fullIcon">⛶</span></button>
    <span id="status" class="status" title="Stav dát"><i></i><span id="statusText">…</span></span>
    </div>
  </nav>
  <main id="chartWrap">
    <div id="bgLayer"></div><div id="bgDim"></div>
    <div id="chart"></div>
    <div id="legend" class="no-chart"><div id="ohlc"></div><div id="studies"></div></div>
    <div id="hint" class="no-chart"></div>
    <div id="drawbar" class="no-chart"></div>
    <div id="histBar" class="no-chart"><span id="histText"></span><button class="btn sm" id="backLive">↩ Späť na živý graf</button></div>
    <div id="replayBar" class="no-chart"></div>
    <button id="showToolbar" class="no-chart" title="Zobraziť panel">☰</button>
  </main>
</div>
<section id="idea" class="no-chart">
  <header id="ideaHead"><span id="ideaTitle">💡 Obchodný nápad</span><span class="grow"></span>
    <button class="ib" id="ideaPrev" title="Predchádzajúci">‹</button><button class="ib" id="ideaNext" title="Ďalší">›</button>
    <button class="ib" id="ideaMin" title="Zbaliť">–</button><button class="ib" id="ideaClose" title="Zavrieť">✕</button></header>
  <div id="ideaBody"></div>
</section>
<section id="newsWin" class="no-chart">
  <header id="newsHead"><span>📰 Správy a odkazy</span><span class="grow"></span>
    <button class="ib" id="newsReload" title="Obnoviť">↻</button><button class="ib" id="newsMin" title="Zbaliť">–</button><button class="ib" id="newsClose" title="Zavrieť">✕</button></header>
  <div id="newsTabs"></div>
  <div id="newsBody"></div>
</section>
<section id="techPage" class="no-chart">
  <header id="techHead"></header>
  <nav id="techTfs"></nav>
  <div id="techBody"></div>
</section>
<section id="libPage" class="no-chart"></section>
<section id="nexusPage" class="no-chart"></section>
<div id="nexusHud" class="no-chart" role="button" title="Nexus – tvoja základňa. Klik = otvoriť · ťahaj = presunúť · koliesko alebo pravý klik = veľkosť"></div>
<section id="algoWin" class="no-chart">
  <header id="algoHead"><span>🧠 Algoritmické obchodovanie</span><span class="grow"></span><span id="algoTabs"><span data-at="rank">🏆 Rebríček</span><span data-at="detail">📋 Algoritmy</span><span data-at="live">📡 Živé signály</span></span>
    <button class="ib" id="algoMin" title="Zbaliť">–</button><button class="ib" id="algoClose" title="Zavrieť">✕</button></header>
  <div id="algoBody"></div>
</section>
<section id="flowWin" class="no-chart">
  <header id="flowHead"><span id="flowTitle">🌊 Tok obchodov</span><span class="grow"></span>
    <select id="flUnit" class="sm" title="Jednotky"></select><input id="flBig" type="number" min="0" step="any" placeholder="veľký ≥" title="Veľký obchod od (v zvolených jednotkách); prázdne = automaticky najväčšie 3 %">
    <button class="ib" id="flowMin" title="Zbaliť">–</button><button class="ib" id="flowClose" title="Zavrieť">✕</button></header>
  <div id="flowBody"></div>
  <div id="flowFoot" class="muted"></div>
</section>
<section id="chatWin" class="no-chart">
  <header id="chatHead"><span class="cw-tabs"><span data-cw="chat">💬 Chat</span><span data-cw="news">📰 Správy</span><span data-cw="board">📌 Nástenka</span></span><span class="grow"></span>
    <select id="chatFilter" class="sm" title="Zobraziť kategóriu alebo priečinok"></select>
    <button class="ib" id="chatMin" title="Zbaliť">–</button><button class="ib" id="chatClose" title="Zavrieť">✕</button></header>
  <div id="chatBody"></div>
  <div id="chatFoot"></div>
</section>
<div id="pop" class="no-chart"></div>
<div id="modal" class="no-chart"></div>
<div id="toast"></div>
<script src="lib/lightweight-charts-5.2.1.js"></script>
<script src="static/studies.js?v=31"></script>
<script src="static/ui.js?v=31"></script>
<script src="static/drawings.js?v=31"></script>
<script src="static/autotl.js?v=31"></script>
<script src="static/struct.js?v=31"></script>
<script src="static/lab-core.js?v=31"></script>
<script src="static/backgrounds.js?v=31"></script>
<script src="static/technicals.js?v=31"></script>
<script src="static/moves.js?v=31"></script>
<script src="static/library.js?v=31"></script>
<script src="static/algos.js?v=31"></script>
<script src="static/flow.js?v=31"></script>
<script src="static/nexus.js?v=31"></script>
<script src="static/i18n.js?v=31"></script>
<script src="static/app.js?v=31"></script>
</body>
</html>
